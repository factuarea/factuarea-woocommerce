name: CI

# Continuous integration for factuarea-for-woocommerce.
#
# Two jobs, split for a reason rather than for tidiness.
#
# `verify` runs the whole `composer verify` script - the PHPUnit suites, the
# WordPress and WooCommerce coding standards, the English-only gate, the
# no-paywall gate and the packaging step - on every PHP version the plugin
# claims to support. It runs on all of them because "Requires PHP: 8.1" is a
# promise made to strangers, and a suite that only ever ran on one runtime does
# not keep it. The gates are cheap enough that running them three times costs
# less than working out which of them are runtime-independent and being wrong.
#
# `e2e` runs once, on its own, because it starts a WordPress and a browser. It
# is the only check in this repository that can see the failure the whole plugin
# exists to prevent: a tax ID field that is registered for one checkout and
# invisible, in silence, on the other.
#
# THIRD-PARTY ACTIONS ARE PINNED BY COMMIT, NEVER BY TAG. A tag is a movable
# pointer: whoever controls the action can repoint `@v4` at anything, and it
# would run here with the repository checked out. The comment after each pin
# says which release the commit was, so a human can read the intent, and
# updating one is a deliberate edit rather than something that happens on its
# own. Same criterion, and the same two commits, as the sibling n8n package.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify — PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the floor the plugin header, composer.json, phpcs.xml.dist and
        # Constants::MINIMUM_PHP_VERSION all declare, and the version a merchant
        # is most likely to be on. 8.2 and 8.3 are what the rest of the
        # supported range looks like today; a deprecation introduced by a newer
        # PHP shows up here rather than in a merchant's error log, and the
        # PHPUnit configuration of this repository fails on deprecations.
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        # `composer install` when there is a lock file, `composer update` when
        # there is not, and the difference is announced rather than hidden.
        #
        # There is no `composer.lock` in this repository today. The plugin
        # declares NO runtime dependency - everything composer installs is
        # developer tooling that never reaches the artefact - so a lock file
        # would pin the sniffer and the test runner and nothing that ships. That
        # makes a fresh resolution honest here in a way it would not be for a
        # library: what it buys is that a tool tightening a rule turns up as a
        # red build instead of the day somebody finally updates.
        #
        # The day a lock file is committed, this step starts installing from it
        # with no edit. Which of the two ran is written into the log, because a
        # build that says "reproducible" while resolving fresh is the kind of
        # claim this repository does not make.
        run: |
          if [ -f composer.lock ]; then
            echo "composer.lock is present: installing exactly what it pins."
            composer install --no-interaction --no-progress --prefer-dist
          else
            echo "::notice::No composer.lock in the repository, so development dependencies are resolved fresh. Nothing composer installs reaches the published artefact."
            composer update --no-interaction --no-progress --prefer-dist
          fi

      - name: composer verify
        # The whole script rather than its five steps one at a time, because the
        # script is the frozen contract of this repository: a workflow that ran
        # its own list of commands would be a second definition of "verified",
        # and the two would diverge the first time one of them changed.
        run: composer verify

  e2e:
    name: End-to-end — both checkouts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check the end-to-end harness is there
        # THIS STEP FAILS THE JOB WHEN THE HARNESS IS MISSING, AND THAT IS THE
        # DECISION.
        #
        # The harness is written by the phase after this one. Until it lands,
        # there is nothing here to run, and there were two ways to say so: skip
        # the job, or fail it. Skipping produces a green tick against a job named
        # "End-to-end — both checkouts", which is a claim that the two checkouts
        # were exercised. They were not. A green that means nothing is the ghost
        # guardrail this repository spends most of its effort removing, and it is
        # worse here than anywhere else, because this is the ONE check that can
        # see a tax ID field that silently fails to paint on the block checkout.
        #
        # So it goes red, naming exactly what is missing. A red that says "this
        # was never run" is information; a green that implies it was is not.
        #
        # There is deliberately no `continue-on-error` on any step of this job.
        run: |
          missing=""
          for path in .wp-env.json playwright.config.js tests/e2e; do
            if [ ! -e "$path" ]; then
              missing="${missing} ${path}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::The end-to-end harness is not in the repository yet, so the two checkouts were NOT exercised. Missing:${missing}. This job fails rather than skipping, because a green tick here would claim the block checkout was tested when nothing ran."
            exit 1
          fi
          echo "Harness present: .wp-env.json, playwright.config.js and tests/e2e."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install the harness
        # Same shape, and the same reason, as the composer step above: install
        # from the lock file when there is one, resolve and say so when there is
        # not. Nothing under node_modules is ever published - package.json
        # declares no runtime dependency at all and .distignore excludes the
        # directory - so this tree exists only to drive a browser.
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json is present: installing exactly what it pins."
            npm ci
          else
            echo "::notice::No package-lock.json in the repository, so the end-to-end tooling is resolved fresh. None of it is published."
            npm install --no-audit --no-fund
          fi

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Start the containerised WordPress
        run: npm run e2e:up

      - name: Run the end-to-end scenarios
        run: npm run e2e

      - name: Stop the containerised WordPress
        # `always()` so that a failed scenario still tears the environment down.
        # A left-running wp-env is not a problem on a fresh runner, but it is on
        # anybody's laptop reading this file for how it is meant to be driven.
        if: always()
        run: npm run e2e:down
